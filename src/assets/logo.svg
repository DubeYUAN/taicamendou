<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EEF2FF" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Back flashcard tilt -->
  <rect x="36" y="24" width="54" height="68" rx="10" transform="rotate(12 63 58)" fill="#818CF8" fill-opacity="0.5" />

  <!-- Front flashcard -->
  <rect x="28" y="28" width="58" height="68" rx="10" fill="url(#cardGrad)" filter="url(#glow)" />

  <!-- Card Lines (Term & Meaning) -->
  <rect x="38" y="42" width="38" height="6" rx="3" fill="#4F46E5" />
  <rect x="38" y="54" width="26" height="4" rx="2" fill="#818CF8" />
  <rect x="38" y="63" width="34" height="3" rx="1.5" fill="#CBD5E1" />
  <rect x="38" y="70" width="20" height="3" rx="1.5" fill="#CBD5E1" />

  <!-- Synapse / Brain Sparkle -->
  <circle cx="88" cy="34" r="5" fill="#FDE047" />
  <path d="M88 24 L88 44 M78 34 L98 34" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="88" cy="34" r="8" stroke="#FDE047" stroke-opacity="0.4" stroke-width="2" />
</svg>
